name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/frontend-backend-mismatches

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and TypeScript build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudbox?schema=public
        run: pnpm exec prisma generate

      - name: Apply database migrations to disposable CI PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudbox?schema=public
        run: pnpm exec prisma migrate deploy

      - name: Test backend unit suite
        working-directory: backend
        run: pnpm test

      - name: Test billing integration against disposable CI PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudbox?schema=public
          CLOUDBOX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudbox?schema=public
        run: pnpm test:integration

      - name: Build backend
        working-directory: backend
        run: pnpm build

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
